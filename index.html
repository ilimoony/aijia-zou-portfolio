<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>Aijia Zou — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="album.css" />
</head>
<body>
  <main class="portfolio" id="portfolio" data-view="cover">
    <header class="masthead"><span>INDEPENDENT DESIGNER</span><span>SELECTED WORKS · 2024—26</span></header>

    <section class="book-scene" aria-label="Aijia Zou portfolio book">
      <div class="album">
        <div class="open-spread" id="openSpread" aria-label="Open portfolio book">
          <img class="spread-art" src="assets/red-open-book-cutout.png" alt="Open red portfolio book with blank white pages" />
          <div class="page-turn" id="pageTurn" aria-hidden="true">
            <div class="page-turn-face page-turn-front"><div class="turn-copy"></div></div>
            <div class="page-turn-face page-turn-back"><div class="turn-copy"></div></div>
          </div>
          <img class="section-art about-art" src="assets/about-me-spread-cutout.png" alt="About Me portfolio spread with a welcome note, portrait, and biography" hidden />
          <img class="section-art experience-art" src="assets/experience-spread-cutout.png" alt="Experience portfolio spread with a career timeline" hidden />
          <img class="section-art video-art" src="assets/video-projects-spread-cutout.png" alt="Video Editing and Directing portfolio spread with documentary, marketing, and dance video projects" hidden />
          <img class="section-art poster-art" src="assets/poster-magazine-spread-cutout.png" alt="Poster and Magazine Design portfolio spread with poster and magazine work thumbnails" hidden />
          <a class="experience-link exp-tedx" href="https://www.ted.com/tedx/events/48571" target="_blank" rel="noopener noreferrer" aria-label="TEDxYouth at Beijing 101 School"></a>
          <a class="experience-link exp-tsinghua" href="https://www.sss.tsinghua.edu.cn/info/1292/5603.htm" target="_blank" rel="noopener noreferrer" aria-label="Tsinghua University Summer Program"></a>
          <a class="experience-link exp-mengyang" href="https://weibo.com/u/5883761953" target="_blank" rel="noopener noreferrer" aria-label="Mengyang Production Co., Ltd."></a>
          <a class="experience-link exp-bona" href="https://www.douyin.com/user/MS4wLjABAAAABd57APoF4wGcsuMrq8DWDvfamaUe5vExaeIOIN87A90?from_tab_name=main" target="_blank" rel="noopener noreferrer" aria-label="Bona Film Group Co., Ltd."></a>
          <a class="experience-link exp-csc" href="https://www.instagram.com/vassar_csc_/?hl=en" target="_blank" rel="noopener noreferrer" aria-label="Chinese Student Community, Vassar College"></a>
          <a class="experience-link exp-kodc" href="https://www.youtube.com/@vassarkodc" target="_blank" rel="noopener noreferrer" aria-label="Korean Dance Organization, Vassar College"></a>
          <a class="experience-link exp-portrait" href="https://www.readportrait.com" target="_blank" rel="noopener noreferrer" aria-label="Portrait Asian-American Student Magazine"></a>
          <a class="experience-link exp-kingame" href="https://v.douyin.com/4SA6wEzWjlc/%207@0.com" target="_blank" rel="noopener noreferrer" aria-label="Domestic Marketing Center, Kingame Co., Limited"></a>
          <a class="video-link video-bartending" href="https://drive.google.com/file/d/1njlwxkPAkxkegl_6D_CBWIGlxuPxSfab/view?usp=sharing" target="_blank" rel="noopener noreferrer" aria-label="Bartending Documentary"></a>
          <a class="video-link video-portrait" href="https://www.youtube.com/watch?v=j-aTg6MRtXU&amp;t=17s" target="_blank" rel="noopener noreferrer" aria-label="Vassar Portrait Magazine Spring 2026 Recap Video"></a>
          <a class="video-link video-bona" href="https://v.douyin.com/UygclvdeUwI/" target="_blank" rel="noopener noreferrer" aria-label="Bona Film Hidden Blade Promotion TikTok"></a>
          <a class="video-link video-duck" href="https://v.douyin.com/Z9ZNK69lu8k/" target="_blank" rel="noopener noreferrer" aria-label="Goose Goose Duck Game Character Promotion TikTok"></a>
          <a class="video-link video-kodc" href="https://www.youtube.com/watch?v=UljY8P9mdRg" target="_blank" rel="noopener noreferrer" aria-label="Vassar Korean Dance Org Music Video"></a>
          <button class="artwork-hotspot hotspot-mid-autumn" type="button" data-preview="assets/poster-mid-autumn.png" aria-label="Preview Mid-Autumn Festival poster"></button>
          <button class="artwork-hotspot hotspot-fall-intro" type="button" data-preview="assets/magazine-fall-intro.png" aria-label="Preview Portrait magazine Fall 2025 cover"></button>
          <button class="artwork-hotspot hotspot-crafted-night" type="button" data-preview="assets/poster-crafted-night.png" aria-label="Preview Crafted Night poster"></button>
          <button class="artwork-hotspot hotspot-new-year" type="button" data-preview="assets/poster-lunar-new-year.png" aria-label="Preview Lunar New Year poster"></button>
          <button class="artwork-hotspot hotspot-weather-girl" type="button" data-preview="assets/magazine-weather-girl.png" aria-label="Preview The Weather Girl magazine page"></button>
          <button class="artwork-hotspot hotspot-strand" type="button" data-preview="assets/magazine-strand-spread.png" aria-label="Preview Strand magazine spread"></button>
          <button class="artwork-hotspot hotspot-time-capsule" type="button" data-preview="assets/magazine-time-capsule.png" aria-label="Preview Time Capsule magazine spread"></button>
          <button class="artwork-hotspot hotspot-thank-you" type="button" data-preview="assets/magazine-thank-you-spread.png" aria-label="Preview Portrait magazine thank-you spread"></button>
          <section class="contents-page" aria-label="Table of contents">
            <img class="contents-art" src="assets/catalog-spread-cutout.png" alt="Handwritten catalog page in the open portfolio book" />
            <button class="toc-link toc-about" type="button" data-section="0" aria-label="Open About Me"></button>
            <button class="toc-link toc-experience" type="button" data-section="1" aria-label="Open Experience"></button>
            <button class="toc-link toc-video" type="button" data-section="2" aria-label="Open Video Editing and Directing"></button>
            <button class="toc-link toc-poster" type="button" data-section="3" aria-label="Open Poster and Magazine Design"></button>
          </section>
          <div class="section-content" aria-live="polite" hidden>
            <span class="section-kicker">A LITTLE ABOUT ME</span>
            <h1 id="sectionTitle">Aijia Zou</h1>
            <p id="sectionDescription">A designer drawn to quiet details, tactile stories, and the space between function and feeling.</p>
          </div>
          <button class="turn-back-ribbon" id="turnBackRibbon" type="button" aria-label="Turn back to the previous page"></button>
          <button class="turn-ribbon" id="turnRibbon" type="button" aria-label="Turn to the next page"></button>
        </div>

        <div class="cover-layer" id="coverLayer">
          <img class="cover-art" src="assets/red-portfolio-cover-cutout.png" alt="Red cloth portfolio cover with white doodles, a portrait window, and a ribbon bow" />
          <button class="cover-bow-hit" id="openBook" type="button" aria-label="Open the portfolio by clicking its ribbon"></button>
        </div>

        <div class="ending" id="ending" aria-label="Portfolio back cover">
          <img class="ending-art" src="assets/red-back-cover-ending-cutout.png" alt="Red portfolio back cover with a handwritten Thank you message" />
          <button class="restart-ending" id="restartEnding" type="button" aria-label="Return to the front cover"></button>
        </div>
      </div>
    </section>

    <footer class="controls">
      <span id="instruction">CLICK THE RIBBON TO OPEN</span>
      <div class="progress"><span id="pageCount">COVER</span><span class="progress-track"><i id="progressFill"></i></span><span>BACK COVER</span></div>
      <button id="resetBook" type="button">START OVER ↺</button>
    </footer>
  </main>
  <img class="desk-note" src="assets/ribbon-note.png" alt="A handwritten note reading Click on the bow to go to the next page" />
  <div class="art-preview" id="artPreview" aria-hidden="true">
    <img id="artPreviewImage" alt="" />
  </div>
  <script src="script.js"></script>
</body>
</html>
